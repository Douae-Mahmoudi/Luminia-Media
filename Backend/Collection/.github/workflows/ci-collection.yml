name: CI Pipeline - Collection Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: collection_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ppp
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # ✅ Ajout du service Kafka pour les tests d'intégration
      kafka:
        image: apache/kafka:latest
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build, Test and SonarQube Analysis
        working-directory: demo
        run: mvn verify sonar:sonar -Dsonar.projectKey=Douae-Mahmoudi_Collection-svc -Dsonar.organization=douae-mahmoudi -Dsonar.host.url=https://sonarcloud.io -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Configuration identique à application.properties pour le CI
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5434/collection_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: ppp
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: collection-service-jar
          path: demo/target/*.jar