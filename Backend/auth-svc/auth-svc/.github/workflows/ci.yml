name: CI Pipeline - Auth Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mediatheque_auth
          POSTGRES_USER: user_admin
          POSTGRES_PASSWORD: password123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build, Test and SonarQube Analysis
        run: mvn verify sonar:sonar -Dsonar.projectKey=Douae-Mahmoudi_Auth-svc -Dsonar.organization=douae-mahmoudi -Dsonar.host.url=https://sonarcloud.io -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mediatheque_auth
          SPRING_DATASOURCE_USERNAME: user_admin
          SPRING_DATASOURCE_PASSWORD: password123
          JWT_SECRET: MaSuperCleSecreteTresLongueEtSecurisee1234567890
          JWT_EXPIRATION: 86400000
          SPRING_MAIL_HOST: smtp.gmail.com
          SPRING_MAIL_PORT: 587
          SPRING_MAIL_USERNAME: test@gmail.com
          SPRING_MAIL_PASSWORD: test
          APP_FRONTEND_URL: http://localhost:4200

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-jar
          path: target/*.jar