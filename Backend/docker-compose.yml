name: mediatheque

networks:
  mediatheque-network:
    driver: bridge

volumes:
  mongo_data:
  postgres_auth_data:
  postgres_collection_data:
  postgres_media_data:
  postgres_notification_data:

services:



  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - mediatheque-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: on-failure
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - mediatheque-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8200:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks:
      - mediatheque-network

  # AI SERVICE

  mongo:
    image: mongo:7
    container_name: ai-svc-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - mediatheque-network

  ai-service:
    build: ./ai-svc
    container_name: ai-svc-app
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/aidb
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - COLLECTION_SERVICE_URL=http://collection-service-app:8083
      - MEDIA_SERVICE_URL=http://media-service-app:8082
    depends_on:
      - mongo
      - kafka
      - collection-service
    networks:
      - mediatheque-network


  auth-db:
    image: postgres:17-alpine
    container_name: auth-db-container
    environment:
      - POSTGRES_DB=mediatheque_auth
      - POSTGRES_USER=user_admin
      - POSTGRES_PASSWORD=1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d mediatheque_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediatheque-network

  auth-service:
    build: ./auth-svc/auth-svc
    container_name: auth-service-app
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth-db:5432/mediatheque_auth
      - SPRING_DATASOURCE_USERNAME=user_admin
      - SPRING_DATASOURCE_PASSWORD=password123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - JWT_EXPIRATION=86400000
      - SPRING_MAIL_HOST=smtp.gmail.com
      - SPRING_MAIL_PORT=587
      - SPRING_MAIL_USERNAME=${MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${MAIL_PASSWORD}
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
      - SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
      - APP_FRONTEND_URL=http://localhost:4200
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - mediatheque-network

  collection-db:
    image: postgres:17-alpine
    container_name: collection-db-container
    environment:
      - POSTGRES_DB=collection_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=ppp
    ports:
      - "5434:5432"
    volumes:
      - postgres_collection_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collection_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediatheque-network

  collection-service:
    build: ./Collection/demo
    container_name: collection-service-app
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://collection-db:5432/collection_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=ppp
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      collection-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - mediatheque-network

  # MEDIA SERVICE

  media-db:
    image: postgres:17-alpine
    container_name: media-db-container
    environment:
      - POSTGRES_DB=mediatheque_media
      - POSTGRES_USER=user_admin
      - POSTGRES_PASSWORD=password123
    ports:
      - "5433:5432"
    volumes:
      - postgres_media_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d mediatheque_media"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediatheque-network

  media-service:
    build: ./media
    container_name: media-service-app
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://media-db:5432/mediatheque_media
      - SPRING_DATASOURCE_USERNAME=user_admin
      - SPRING_DATASOURCE_PASSWORD=password123
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      media-db:
        condition: service_healthy
    networks:
      - mediatheque-network

  # NOTIFICATION SERVICE

  notification-db:
    image: postgres:16-alpine
    container_name: notification-postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5435:5432"
    volumes:
      - postgres_notification_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediatheque-network

  notification-svc:
    build: ./notification-svcc
    container_name: notification-svc
    ports:
      - "8086:8086"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: on-failure
    networks:
      - mediatheque-network
