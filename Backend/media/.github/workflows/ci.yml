name: CI Pipeline - Media Service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mediatheque_media
          POSTGRES_USER: user_admin
          POSTGRES_PASSWORD: password123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 15
          --health-start-period 30s

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Build, Test and SonarQube Analysis
        run: mvn verify sonar:sonar -Dsonar.projectKey=Douae-Mahmoudi_Media-svc -Dsonar.organization=douae-mahmoudi -Dsonar.host.url=https://sonarcloud.io -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/mediatheque_media
          SPRING_DATASOURCE_USERNAME: user_admin
          SPRING_DATASOURCE_PASSWORD: password123
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          JWT_SECRET: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
          EXTERNAL_TMDB_API_KEY: fake-key
          EXTERNAL_TMDB_BASE_URL: http://localhost:9999/tmdb
          EXTERNAL_RAWG_API_KEY: fake-key
          EXTERNAL_RAWG_BASE_URL: http://localhost:9999/rawg
          EXTERNAL_GOOGLE_BOOKS_BASE_URL: http://localhost:9999/books
          EXTERNAL_ITUNES_BASE_URL: http://localhost:9999/itunes

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-service-jar
          path: target/*.jar